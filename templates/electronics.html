{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header>
<div class="logo">ShopEase</div>

<nav>
<ul>
<li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'products' %}">Products</a></li>
                <li><a href="{% url 'categories' %}">Categories</a></li>
                <li><a href="{% url 'contact' %}">Contact</a></li>

</ul>
</nav>
</header>

<section class="products">

<h1>Electronics</h1>

<div class="product-grid">

<div class="product-card">
<img src="{% static 'images/laptop.jpg' %}" alt="Laptop" class="product-image">
<h3>Laptop</h3>
<p>₹55,000</p>
<a href="{% url 'payment' %}"><button>Buy Now</button></a>
</div>

<div class="product-card">
<img src="{% static 'images/smart phone.jpg' %}" alt="Smart Phone" class="product-image">
<h3>Smart Phone</h3>
<p>₹25,000</p>
<a href="{% url 'payment' %}"><button>Buy Now</button></a>
</div>

<div class="product-card">
<img src="{% static 'images/headphones.jpg' %}" alt="Headphone" class="product-image">
<h3>Headphone</h3>
<p>₹2,000</p>
<a href="{% url 'payment' %}"><button>Buy Now</button></a>
</div>

</div>

</section>

</body>
</html>
