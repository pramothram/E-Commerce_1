{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header>
<div class="logo">ShopEase</div>

<nav>
<ul>
                <li><a href="/">Home</a></li>
                <li><a href="{% url 'products' %}">Products</a></li>
                <li><a href="{% url 'categories' %}">Categories</a></li>
                <li><a href="{% url 'contact' %}">Contact</a></li>

</ul>
</nav>
</header>

<section class="products">

<h1>Home Appliances</h1>

<div class="product-grid">

<div class="product-card">
<img src="{% static 'images/tv.jpg' %}" alt="Smart TV" class="product-image">
<h3>Smart TV</h3>
<a href="{% url 'payment' %}"><button>Buy Now</button></a>
</div>

<div class="product-card">
<img src="{% static 'images/fridge.jpg' %}" alt="Refrigerator" class="product-image">
<h3>Refrigerator</h3>
<p>₹32,000</p>
<a href="{% url 'payment' %}"><button>Buy Now</button></a>
</div>

<div class="product-card">
<img src="{% static 'images/wm.jpg' %}" alt="Washing Machine" class="product-image">
<h3>Washing Machine</h3>
<p>₹24,000</p>
<a href="{% url 'payment' %}"><button>Buy Now</button></a>
</div>

</div>

</section>

</body>
</html>
